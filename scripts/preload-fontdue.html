<!-- Fontdue preload + page gate — paste into Site Settings → Custom Code → End of <head>.
     Hides body until every font (Fontdue + Framer + anything else) is downloaded,
     then reveals once. 3s safety. -->
<style>html.fontdue-loading body{opacity:0!important}html.fontdue-ready body{opacity:1;transition:opacity .2s ease}</style>
<script>
(function () {
    var URL = "https://www.publictype.us"
    var H = document.documentElement
    H.classList.add("fontdue-loading")
    var done = false, safety
    function reveal() {
        if (done) return
        done = true
        clearTimeout(safety)
        H.classList.remove("fontdue-loading")
        H.classList.add("fontdue-ready")
    }
    function waitAllFonts() {
        // document.fonts.ready resolves when every pending face load is
        // done — covers Framer's own fonts, not just ours.
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(reveal, reveal)
        } else reveal()
    }
    safety = setTimeout(reveal, 3000)

    var Q = "{viewer{fontCollections(first:100){edges{node{fontStyles{name cssFamily webfontSources{format url} variableAxes{axis}} children{fontStyles{name cssFamily webfontSources{format url} variableAxes{axis}}}}}}}}"

    var rules = [], fams = {}, urls = {}

    function face(f, ss) {
        var o = ss.slice().sort(function (a, b) {
            var s = function (x) { return x === "woff2" ? 0 : x === "woff" ? 1 : 2 }
            return s(a.format) - s(b.format)
        })
        return '@font-face{font-family:"' + f + '";font-style:normal;font-weight:100 900;font-display:swap;src:local(""),' +
            o.map(function (s) { return 'url("' + s.url + '") format("' + s.format + '")' }).join(",") + ";}"
    }
    function reg(f, ss) { if (!f || fams[f]) return; fams[f] = 1; rules.push(face(f, ss)) }
    function pre(ss) {
        for (var i = 0; i < ss.length; i++) {
            var s = ss[i]
            if (s.format !== "woff2" || !s.url || urls[s.url]) continue
            urls[s.url] = 1
            var l = document.createElement("link")
            l.rel = "preload"; l.as = "font"; l.type = "font/woff2"
            l.href = s.url; l.crossOrigin = "anonymous"
            document.head.appendChild(l)
        }
    }
    function walk(list) {
        if (!list) return
        for (var i = 0; i < list.length; i++) {
            var s = list[i], cf = (s.cssFamily || "").trim(), ss = s.webfontSources || []
            if (!cf || !ss.length) continue
            var v = (s.variableAxes || []).length > 0, ln = s.name ? cf + " " + s.name : cf
            if (v) { reg(cf, ss); if (s.name) reg(ln, ss) } else reg(ln, ss)
            pre(ss)
        }
    }

    fetch(URL + "/graphql", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: Q })
    })
        .then(function (r) { return r.json() })
        .then(function (d) {
            var w = d && d.data && d.data.viewer && d.data.viewer.fontCollections
            var es = (w && w.edges) || []
            for (var i = 0; i < es.length; i++) {
                var n = es[i] && es[i].node
                if (!n) continue
                walk(n.fontStyles)
                var ch = n.children || []
                for (var j = 0; j < ch.length; j++) walk(ch[j] && ch[j].fontStyles)
            }
            if (rules.length) {
                var e = document.createElement("style")
                e.setAttribute("data-fontdue-preload", "true")
                e.textContent = rules.join("\n")
                document.head.appendChild(e)
            }
            var ks = Object.keys(fams)
            if (ks.length && document.fonts && document.fonts.load) {
                Promise.all(ks.map(function (f) {
                    return document.fonts.load('100px "' + f + '"').catch(function () { return null })
                })).then(waitAllFonts)
            } else waitAllFonts()
        })
        .catch(waitAllFonts)
})()
</script>
